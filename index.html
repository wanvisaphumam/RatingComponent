<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/fontawesome.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/solid.css" />
    <title>RatingComponent</title>
  </head>
  <body>
    <div class="container">
      <div class="card mt-5 bg-light shadow-lg border-0 rounded-4">
        <div class="card-body">
          <!-- Rating Summary -->
          <div class="row p-5">
            <div class="col-7">
              <h2>What others think about the product</h2>
            </div>
            <div class="col-5">
              <div class="card">
                <div class="card-body">
                  <h3 class="display-5 fw-semibold">
                    <i class="fa-solid fa-star text-warning"></i>4.8
                  </h3>
                  <p class="text-center">Average rating</p>
                </div>
              </div>
            </div>
          </div>
          <!-- Search box -->
          <div class="row p-5">
            <div class="col-12">
              <div class="input-group input-group-lg">
                <span class="input-group-text rounded-start-5">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" class="form-control rounded-end-5" placeholder="Search reviews..." />
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
